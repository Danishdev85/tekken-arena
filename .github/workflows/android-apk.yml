name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TEKKEN ARENA - Android APK
          body: Installable Android APK of TEKKEN ARENA. Download app-debug.apk on your Android phone, allow install from your browser once, and install. Works fully offline.
          files: android/app/build/outputs/apk/debug/app-debug.apk
